site_name: Motorix
site_description: Heavy mining engine repair management platform
site_url: https://zerik-official.github.io/Motorix/docs/
docs_dir: docs
exclude_docs: |
  README.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Architecture: Arquitectura
            Overview: Visión general
            Data model: Modelo de datos
            Security: Seguridad
            Services: Servicios
            Web app: Aplicación web
            API documentation: Documentación de la API
            Operations: Operación
            Testing and CI: Pruebas y CI
            Deployment: Despliegue
            Glossary: Glosario

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture:
      - Overview: architecture.md
      - Data model: data-model.md
      - Security: security.md
  - Services:
      - services/index.md
      - auth-api: services/auth-api.md
      - business-api: services/business-api.md
      - Web app: services/web.md
      - API documentation: api-docs.md
  - Operations:
      - Testing and CI: testing.md
      - Deployment: deployment.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
