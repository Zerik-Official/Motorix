name: motorix

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      AUTH_DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      BUSINESS_DB_NAME: ${BUSINESS_DB_NAME:?BUSINESS_DB_NAME is required}
      BUSINESS_DB_USER: ${BUSINESS_DB_USER:?BUSINESS_DB_USER is required}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
