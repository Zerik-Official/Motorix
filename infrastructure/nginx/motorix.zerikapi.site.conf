server {
    listen 80;
    listen [::]:80;
    server_name motorix.zerikapi.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motorix.zerikapi.site;

    ssl_certificate /etc/letsencrypt/live/motorix.zerikapi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motorix.zerikapi.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/v1/(auth|users|roles)(/|$) {
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
