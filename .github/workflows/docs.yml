name: docs

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material and the i18n plugin
        run: pip install -r requirements-docs.txt

      - name: Build the site in both languages, failing on any warning
        run: mkdocs build --strict

      - name: Nest the built site under /docs, so it lands at /Motorix/docs/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages-root/docs
          cp -r site/. pages-root/docs/

      - name: Set up the Pages environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the built site as a Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
