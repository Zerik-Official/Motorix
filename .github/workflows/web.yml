name: web

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: apps/web

env:
  VITE_AUTH_API_URL: http://localhost:3000
  VITE_BUSINESS_API_URL: http://localhost:8000
  VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  VITE_SITE_URL: https://motorix.example

jobs:
  lint-test-build:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with ESLint
        run: bun run lint

      - name: Type check with tsc
        run: bun run typecheck

      - name: Run the test suite
        run: bun run test

      - name: Build for production
        run: bun run build

      - name: Verify the build replaced every environment placeholder
        run: |
          test -f dist/index.html
          if grep --quiet "%VITE_" dist/index.html; then
            echo "dist/index.html still has unreplaced %VITE_ placeholders" >&2
            exit 1
          fi
          grep --quiet "https://motorix.example/" dist/index.html
